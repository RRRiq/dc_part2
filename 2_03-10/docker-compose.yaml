services:
  frontend:
    image: rrrrrrriq/example-frontend:v2   

  backend:
    image: rrrrrrriq/example-backend:v2 


    environment:
      - REQUEST_ORIGIN=http://localhost:8000
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=12345

  redis:
    image: redis


  db:
    image: postgres:18
    volumes:
      - ./database:/var/lib/postgresql

    environment:
      POSTGRES_PASSWORD: 12345

  nginx:
    image: nginx
    ports:
    - 8000:80
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
    - frontend
    - backend

