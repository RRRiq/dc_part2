services:
  frontend:
    image: rrrrrrriq/example-frontend:v1   
    ports:
      - "5001:5001"


  backend:
    image: rrrrrrriq/example-backend:v1 
    ports:
      - "8080:8080"

    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=12345

  redis:
    image: redis
  postgres:
    image: postgres:18

    environment:
      POSTGRES_PASSWORD: 12345

